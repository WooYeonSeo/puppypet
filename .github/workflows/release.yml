name: Release DMG

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build DMG
        run: ./scripts/build_dmg.sh

      - name: Rename DMG with tag
        if: github.event_name == 'release'
        run: cp build/PuppyPet.dmg "build/PuppyPet-${{ github.event.release.tag_name }}.dmg"

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/PuppyPet-${{ github.event.release.tag_name }}.dmg

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PuppyPet-dmg
          path: build/PuppyPet.dmg
