name: Release DMG

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (need 26.x — project deployment target is macOS 15.6)
        run: |
          for candidate in Xcode_26.2.app Xcode_26.3.app Xcode_26.1.1.app Xcode_26.0.1.app; do
            if [ -d "/Applications/$candidate" ]; then
              sudo xcode-select -s "/Applications/$candidate"
              echo "Selected /Applications/$candidate"
              break
            fi
          done

      - name: Show Xcode and SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos

      - name: Build DMG
        run: ./scripts/build_dmg.sh

      - name: Rename DMG with tag
        if: github.event_name == 'release'
        run: cp build/PuppyPet.dmg "build/PuppyPet-${{ github.event.release.tag_name }}.dmg"

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/PuppyPet-${{ github.event.release.tag_name }}.dmg

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PuppyPet-dmg
          path: build/PuppyPet.dmg
